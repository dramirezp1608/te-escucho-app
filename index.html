<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Te escucho</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Iconos de Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla de validación / Bloqueo -->
    <div id="authScreen" style="display: flex; height: 100dvh; justify-content: center; align-items: center; text-align: center; padding: 20px;">
        <div class="glass-panel" style="padding: 40px; max-width: 400px;">
            <div class="avatar ai-avatar" style="margin: 0 auto 20px;"><span>🤖</span></div>
            <h2 id="authTitle">Iniciando conexión...</h2>
            <p id="authMessage" style="color: var(--text-secondary); margin-top: 10px;">Verificando credenciales del proyecto.</p>
        </div>
    </div>

    <div class="app-container" id="chatApp" style="display: none;">
        <!-- Modal for API Key -->
        <div id="apiKeyModal" class="modal-overlay">
            <div class="modal-content glass-panel">
                <h2>Configuración inicial</h2>
                <p>Ingresa tu API Key de Groq para habilitar el reconocimiento de voz con Whisper. Esta clave solo se guardará localmente en tu navegador.</p>
                <div class="input-group">
                    <label for="apiKeyInput">Groq API Key (Whisper)</label>
                    <input type="password" id="apiKeyInput" placeholder="gsk_...">
                </div>
                <div class="input-group">
                    <label for="copilotUrlInput">URL de Conexión (Endpoint)</label>
                    <input type="text" id="copilotUrlInput" placeholder="https://directline.botframework.com/v3/directline/conversations">
                </div>
                <div class="input-group">
                    <label for="copilotSecretInput">Copilot Direct Line Secret</label>
                    <input type="password" id="copilotSecretInput" placeholder="Ingresa tu secreto o token de Copilot">
                </div>
                <div class="modal-buttons">
                    <button id="saveApiKeyBtn" class="btn-primary">Guardar</button>
                </div>
                <button id="skipApiKeyBtn" class="btn-text">Continuar sin audio por ahora</button>
            </div>
        </div>

        <!-- Header -->
        <header class="chat-header glass-panel">
            <div class="avatar-container">
                <div class="avatar ai-avatar">
                    <span class="material-symbols-rounded">robot_2</span>
                </div>
                <div class="status-indicator"></div>
            </div>
            <div class="header-info">
                <h1>Cuentame AI</h1>
                <span class="status-text" id="chatStatus">Conectando...</span>
            </div>
            <button id="resetBtn" class="icon-btn" title="Reiniciar conversación">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
        </header>

        <!-- Chat Area -->
        <main id="chatBox" class="chat-box">
            <!-- Messages will be injected here -->
        </main>

        <!-- Input Area -->
        <footer class="chat-footer glass-panel">
            <div id="recordingIndicator" class="recording-indicator hidden">
                <div class="pulse-ring"></div>
                <span class="material-symbols-rounded">mic</span>
                <span id="recordingTimer">00:00</span>
                <button id="cancelRecordBtn" class="icon-btn danger">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            
            <form id="chatForm" class="input-area">
                <button type="button" id="recordBtn" class="icon-btn mic-btn" title="Grabar audio">
                    <span class="material-symbols-rounded">mic</span>
                </button>
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
                </div>
                <button type="submit" id="sendBtn" class="icon-btn send-btn" title="Enviar">
                    <span class="material-symbols-rounded">send</span>
                </button>
            </form>
        </footer>
    </div>

    <!-- Librerías para renderizar Markdown y Adaptive Cards -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/adaptivecards/dist/adaptivecards.min.js"></script>

    <script type="module" src="/app.js"></script>
</body>
</html>
